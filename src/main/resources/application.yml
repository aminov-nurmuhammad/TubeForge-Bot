spring:
  application:
    name: tubeforge-bot

  datasource:
    url: jdbc:postgresql://localhost:5432/youtube
    username: postgres
    password: "1122qaqa"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  codec:
    max-in-memory-size: 8MB

  task:
    scheduling:
      pool:
        size: 3

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: TubeForge Bot
    version: 1.0.0
    description: Self-hosted Telegram media toolkit

tubeforge:
  telegram:
    token: "8879214208:AAGeFsbY899-fXaW9Enj0ioxp5w_qCcHJ6A"
    api-base-url: https://api.telegram.org
    polling-enabled: true
    polling-timeout-seconds: 25
    max-upload-bytes: 50000000

  media:
    yt-dlp-path: "C:/TubeForgeTools/yt-dlp.exe"
    ffmpeg-path: "C:/TubeForgeTools/ffmpeg/bin/ffmpeg.exe"
    ffprobe-path: "C:/TubeForgeTools/ffmpeg/bin/ffprobe.exe"
    storage-path: "./storage"
    process-timeout: PT2H
    metadata-timeout: PT90S
    max-video-duration-seconds: 10800
    max-playlist-items: 20
    max-concurrent-jobs: 1
    cache-retention: PT24H
    progress-update-interval: PT3S

  access:
    mode: PUBLIC
    admin-user-ids: []
    allowed-user-ids: []
    daily-job-limit: 20
    require-terms-acceptance: true

  features:
    video-download: true
    audio-download: true
    thumbnails: true
    subtitles: true
    transcripts: true
    clips: true
    playlists: true
    ai-coming-soon: true

logging:
  level:
    root: INFO
    uz.tubeforge: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"