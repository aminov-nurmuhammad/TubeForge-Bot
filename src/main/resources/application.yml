spring:
  application:
    name: tubeforge-bot

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/tubeforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  codec:
    max-in-memory-size: 8MB

  task:
    scheduling:
      pool:
        size: 3

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: TubeForge Bot
    version: 6.0.0
    description: Self-hosted Telegram media toolkit

tubeforge:
  telegram:
    token: ${TELEGRAM_BOT_TOKEN:}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:true}
    polling-timeout-seconds: ${TELEGRAM_POLLING_TIMEOUT_SECONDS:25}
    max-upload-bytes: ${TELEGRAM_MAX_UPLOAD_BYTES:50000000}

  media:
    yt-dlp-path: ${YT_DLP_PATH:yt-dlp}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    cookies-file: ${YOUTUBE_COOKIES_FILE:}
    proxy-url: ${YOUTUBE_PROXY_URL:}
    storage-path: ${MEDIA_STORAGE_PATH:./storage}
    process-timeout: ${MEDIA_PROCESS_TIMEOUT:PT2H}
    metadata-timeout: ${MEDIA_METADATA_TIMEOUT:PT90S}
    socket-timeout: ${MEDIA_SOCKET_TIMEOUT:PT30S}
    max-video-duration-seconds: ${MAX_VIDEO_DURATION_SECONDS:10800}
    max-playlist-items: ${MAX_PLAYLIST_ITEMS:20}
    max-concurrent-jobs: ${MAX_CONCURRENT_JOBS:2}
    max-concurrent-inspections: ${MAX_CONCURRENT_INSPECTIONS:4}
    max-queued-jobs: ${MAX_QUEUED_JOBS:500}
    max-queued-inspections: ${MAX_QUEUED_INSPECTIONS:1000}
    concurrent-fragments: ${YT_DLP_CONCURRENT_FRAGMENTS:4}
    extractor-retries: ${YT_DLP_RETRIES:5}
    cache-retention: ${MEDIA_CACHE_RETENTION:PT24H}
    progress-update-interval: ${PROGRESS_UPDATE_INTERVAL:PT3S}

  cache:
    enabled: ${CACHE_ENABLED:true}
    artifact-retention: ${ARTIFACT_CACHE_RETENTION:PT720H}
    insight-retention: ${AI_CACHE_RETENTION:PT168H}

  ai:
    provider: ${AI_PROVIDER:local}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3:4b}
    timeout: ${AI_TIMEOUT:PT3M}
    max-transcript-characters: ${AI_MAX_TRANSCRIPT_CHARACTERS:30000}

  access:
    mode: ${ACCESS_MODE:PUBLIC}
    admin-user-ids: ${ADMIN_USER_IDS:1491734372}
    allowed-user-ids: ${ALLOWED_USER_IDS:}
    daily-job-limit: ${DAILY_JOB_LIMIT:20}
    require-terms-acceptance: ${REQUIRE_TERMS_ACCEPTANCE:true}

  features:
    video-download: ${FEATURE_VIDEO_DOWNLOAD:true}
    audio-download: ${FEATURE_AUDIO_DOWNLOAD:true}
    thumbnails: ${FEATURE_THUMBNAILS:true}
    subtitles: ${FEATURE_SUBTITLES:true}
    transcripts: ${FEATURE_TRANSCRIPTS:true}
    clips: ${FEATURE_CLIPS:true}
    playlists: ${FEATURE_PLAYLISTS:true}
    ai-studio: ${FEATURE_AI_STUDIO:true}
    instagram-reels: ${FEATURE_INSTAGRAM_REELS:true}

logging:
  level:
    root: INFO
    uz.tubeforge: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
