spring:
  datasource:
    url: jdbc:h2:mem:tubeforge-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 0

tubeforge:
  telegram:
    token: test-token
    api-base-url: https://api.telegram.org
    polling-enabled: false
    polling-timeout-seconds: 1
    max-upload-bytes: 50000000
  media:
    yt-dlp-path: yt-dlp
    ffmpeg-path: ffmpeg
    ffprobe-path: ffprobe
    cookies-file:
    proxy-url:
    storage-path: ./target/test-storage
    process-timeout: PT1M
    metadata-timeout: PT10S
    socket-timeout: PT5S
    max-video-duration-seconds: 10800
    max-playlist-items: 5
    max-concurrent-jobs: 1
    max-concurrent-inspections: 1
    max-queued-jobs: 20
    max-queued-inspections: 20
    concurrent-fragments: 1
    extractor-retries: 1
    cache-retention: PT1H
    progress-update-interval: PT1S
  cache:
    enabled: true
    artifact-retention: PT24H
    insight-retention: PT24H
  ai:
    provider: local
    base-url: http://localhost:11434
    model: test-model
    timeout: PT5S
    max-transcript-characters: 10000
  access:
    mode: PUBLIC
    admin-user-ids:
    allowed-user-ids:
    daily-job-limit: 20
    require-terms-acceptance: false
  features:
    video-download: true
    audio-download: true
    thumbnails: true
    subtitles: true
    transcripts: true
    clips: true
    playlists: true
    ai-studio: true
